[project]
name = "towerfall-rl"
version = "0.1.0"
description = "Reinforcement learning agent for TowerFall Ascension"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

# RTX 50-series (Blackwell) needs a CUDA 12.8+ build of PyTorch; the default PyPI wheel on Windows is CPU-only.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
